
- title: "Zero-shot Multimodal Document Retrieval via Cross-modal Question Generation"
  authors: Yejin Choi*, Jaewoo Park*, Janghan Yoon, Saejin Kim, Jaehyun jeon, Youngjae Yu
  image: PREMIR.png
  journal: Under Review
  summary: TLDR; PREMIR makes retrieval more practical and robust by using cross-modal pre-questions over token-level matching, outperforming baselines in real-world closed-domain, and multimodal multilingual tasks.



- title: "G1yphD3c0de: Towards Safer Language Models on Visually Perturbed Texts"
  authors: Yejin Choi, Yejin Yeo, Yejin Son, Seungju Han, Youngjae Yu
  image: GLYPHDECODE.png
  journal: COLM'2025
  summary: TLDR; We introduce GlyphDecode, a multimodal framework for restoring visually perturbed text and enhancing content moderation, featuring a lightweight GlyphRestorer and the GlyphSynth benchmark for real-world evaluation.



- title: "Towards Visual Text Design Transfer Across Languages"
  authors: Yejin Choi*, Jiwan Chung*, Sumin Shim, Giyeong Oh, Youngjae Yu
  url: https://arxiv.org/abs/2410.18823
  journal: NeurIPS'2024
  image: SIGIL.png
  summary: TLDR; We introduces MuST-Bench for evaluating generative models’ visual text style translation across languages and proposes SIGIL as the framework for achieving it.



- title: "G-FOCUS: Towards a Robust Method for Assessing UI Design Persuasiveness"
  authors: "Jaehyun Jeon, Jang Han Yoon, Min Soo Kim, Sumin Shim, Yejin Choi, Hanbin Kim, Youngjae Yu"
  url: https://arxiv.org/abs/2505.05026
  journal: Under Review
  image: GFOCUS.png
  summary: TLDR; We introduce WiserUI-Bench, a benchmark with 300 real-world UI image pairs and A/B test results for assessing design persuasiveness. Our reasoning strategy, G-FOCUS, enhances VLMs' reliability in UI evaluation by reducing bias and improving accuracy.